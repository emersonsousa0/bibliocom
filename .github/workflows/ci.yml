
name: CI - BiblioCom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bibliocom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bibliocom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bibliocom

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Criar pasta de evidências
        run: mkdir -p evidencias

      - name: Executar migrações
        run: npm run migration:run 2>&1 | tee evidencias/migrations.log

      - name: Popular banco de dados
        run: npm run db:seed 2>&1 | tee evidencias/seed.log

      - name: Executar consultas Repository
        run: npm run db:consultas 2>&1 | tee evidencias/consultas.log

      - name: Demonstrar problema N+1
        run: npm run db:n1 2>&1 | tee evidencias/n1.log

      - name: Executar relatórios QueryBuilder
        run: npm run db:relatorios 2>&1 | tee evidencias/relatorios.log

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Compilar aplicação
        run: npm run build

      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-bibliocom
          path: evidencias/
          if-no-files-found: warn
