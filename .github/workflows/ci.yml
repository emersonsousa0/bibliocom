
name: CI - BiblioCom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bibliocom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bibliocom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bibliocom

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Testar conexão com Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e 'const { Client } = require("pg"); (async () => { const client = new Client({ connectionString: process.env.DATABASE_URL }); try { await client.connect(); const r = await client.query("SELECT current_database() AS banco, current_user AS usuario"); console.log(r.rows[0]); } finally { await client.end(); } })().catch(e => { console.error(e); process.exit(1); });'

      - name: Executar migrações no Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migration:run

      - name: Popular banco Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:seed

      - name: Popular Neon com volume N+1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx src/database/seed-volume.ts

      - name: Criar pasta de evidências
        run: mkdir -p evidencias

      - name: Executar migrações no PostgreSQL de testes
        run: |
          set -o pipefail
          npm run migration:run 2>&1 | tee evidencias/migrations.log

      - name: Popular PostgreSQL de testes
        run: |
          set -o pipefail
          npm run db:seed 2>&1 | tee evidencias/seed.log

      - name: Popular PostgreSQL de testes com volume
        run: node --import tsx src/database/seed-volume.ts

      - name: Executar consultas Repository
        run: |
          set -o pipefail
          npm run db:consultas 2>&1 | tee evidencias/consultas.log

      - name: Demonstrar problema N+1
        run: |
          set -o pipefail
          npm run db:n1 2>&1 | tee evidencias/n1.log

      - name: Executar relatórios QueryBuilder
        run: |
          set -o pipefail
          npm run db:relatorios 2>&1 | tee evidencias/relatorios.log

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Guardar OpenAPI anterior
        run: |
          if [ -f openapi.json ]; then
            cp openapi.json /tmp/openapi-versionado.json
            touch /tmp/openapi-existia
          fi

      - name: Compilar aplicação
        run: npm run build

      - name: Gerar e validar OpenAPI
        run: |
          node dist/main.js > /tmp/bibliocom-api.log 2>&1 &
          API_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/docs-json > /dev/null; then
              break
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              cat /tmp/bibliocom-api.log
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:3000/api/docs-json > /dev/null
          test -s openapi.json

          kill "$API_PID" 2>/dev/null || true

      - name: Verificar alterações no OpenAPI
        run: |
          if [ -f /tmp/openapi-existia ]; then
            diff -u /tmp/openapi-versionado.json openapi.json
          else
            echo "::warning::openapi.json ainda não está versionado. Baixe o artefato desta execução e adicione-o ao repositório."
          fi

      - name: Testar limite de paginação
        run: |
          node dist/main.js > /tmp/bibliocom-api-pagination.log 2>&1 &
          API_PID=$!

          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/obras > /dev/null; then
              break
            fi
            sleep 2
          done

          RESULTADO=$(curl -s -o /tmp/paginacao.json -w "%{http_code} %{time_total}" "http://localhost:3000/obras?pagina=1&tamanho=100000")
          echo "Resposta e tempo: $RESULTADO"

          CODIGO=$(echo "$RESULTADO" | awk '{print $1}')
          kill "$API_PID" 2>/dev/null || true

          test "$CODIGO" = "400"

      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-bibliocom
          path: |
            evidencias/
            openapi.json
          if-no-files-found: warn
