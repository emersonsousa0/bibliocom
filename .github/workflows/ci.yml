
name: CI - BiblioCom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bibliocom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bibliocom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bibliocom

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Testar conexão com Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node -e 'const { Client } = require("pg"); (async () => { const client = new Client({ connectionString: process.env.DATABASE_URL }); try { await client.connect(); const r = await client.query("SELECT current_database() AS banco, current_user AS usuario"); console.log("Conexão com Neon estabelecida!"); console.log(r.rows[0]); } finally { await client.end(); } })().catch(e => { console.error("Falha na conexão com Neon:", e.message); process.exit(1); });'

      - name: Executar migrações no Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migration:run

      - name: Popular banco Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:seed

      - name: Popular Neon com volume para N+1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx src/database/seed-volume.ts

      - name: Criar pasta de evidências
        run: mkdir -p evidencias

      - name: Executar migrações no PostgreSQL de testes
        run: |
          set -o pipefail
          npm run migration:run 2>&1 | tee evidencias/migrations.log

      - name: Popular PostgreSQL de testes
        run: |
          set -o pipefail
          npm run db:seed 2>&1 | tee evidencias/seed.log

      - name: Popular PostgreSQL de testes com volume N+1
        run: |
          set -o pipefail
          node --import tsx src/database/seed-volume.ts

      - name: Executar consultas Repository
        run: |
          set -o pipefail
          npm run db:consultas 2>&1 | tee evidencias/consultas.log

      - name: Demonstrar problema N+1
        run: |
          set -o pipefail
          npm run db:n1 2>&1 | tee evidencias/n1.log

      - name: Executar relatórios QueryBuilder
        run: |
          set -o pipefail
          npm run db:relatorios 2>&1 | tee evidencias/relatorios.log

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Compilar aplicação
        run: npm run build

      - name: Salvar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-bibliocom
          path: evidencias/
          if-no-files-found: warn
