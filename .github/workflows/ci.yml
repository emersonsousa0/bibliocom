
name: CI - BiblioCom

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bibliocom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bibliocom"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bibliocom

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install

      - name: Verificar conexao com Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({
            connectionString: process.env.DATABASE_URL,
            ssl: { rejectUnauthorized: false }
          });
          await client.connect();
          const result = await client.query('SELECT current_database() AS banco');
          console.log('Conectado ao Neon:', result.rows[0].banco);
          await client.end();
          NODE

      - name: Executar migrations no Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migration:run

      - name: Executar seed principal no Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:seed

      - name: Popular volume de demonstracao no Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --import tsx src/database/seed-volume.ts

      - name: Criar pasta de evidencias
        run: mkdir -p evidencias

      - name: Executar migrations no PostgreSQL de teste
        run: npm run migration:run 2>&1 | tee evidencias/migrations.txt

      - name: Executar seed principal
        run: npm run db:seed 2>&1 | tee evidencias/seed.txt

      - name: Popular volume de demonstracao
        run: node --import tsx src/database/seed-volume.ts

      - name: Executar consultas Repository
        run: npm run db:consultas 2>&1 | tee evidencias/consultas.txt

      - name: Demonstrar problema N+1
        run: npm run db:n1 2>&1 | tee evidencias/n1.txt

      - name: Executar relatorios QueryBuilder
        run: npm run db:relatorios 2>&1 | tee evidencias/relatorios.txt

      - name: Executar testes automatizados
        run: npm run test:e2e -- --runInBand

      - name: Compilar aplicacao
        run: npm run build

      - name: Guardar OpenAPI anterior
        run: |
          if [ -f openapi.json ]; then
            cp openapi.json /tmp/openapi-versionado.json
            touch /tmp/openapi-existia
          fi

      - name: Gerar e validar OpenAPI
        run: |
          node dist/main.js > /tmp/bibliocom-api.log 2>&1 &
          API_PID=$!

          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/docs-json -o openapi.json; then
              break
            fi
            sleep 2
          done

          if [ ! -s openapi.json ]; then
            cat /tmp/bibliocom-api.log
            kill $API_PID || true
            echo "Falha ao gerar openapi.json"
            exit 1
          fi

          kill $API_PID || true
          echo "OpenAPI gerado com sucesso."

      - name: Verificar alteracoes na especificacao OpenAPI
        run: |
          if [ -f /tmp/openapi-existia ]; then
            diff -u /tmp/openapi-versionado.json openapi.json
          else
            echo "Primeira geracao do OpenAPI. O arquivo sera versionado na proxima etapa."
          fi

      - name: Testar limite da paginacao
        run: |
          node dist/main.js > /tmp/bibliocom-api-pagination.log 2>&1 &
          API_PID=$!

          for i in {1..30}; do
            if curl -s http://localhost:3000/obras -o /dev/null; then
              break
            fi
            sleep 2
          done

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000/obras?pagina=1&tamanho=100000")

          kill $API_PID || true

          echo "Status recebido para tamanho=100000: $STATUS"

          if [ "$STATUS" != "400" ]; then
            echo "O limite de paginacao nao retornou HTTP 400."
            exit 1
          fi

      - name: Salvar evidencias da execucao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-bibliocom
          path: |
            evidencias/
            openapi.json
          if-no-files-found: warn
